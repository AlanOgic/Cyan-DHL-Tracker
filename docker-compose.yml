services:
  dhl-tracker:
    build: .
    container_name: dhl-automated-tracker
    restart: unless-stopped
    environment:
      - DHL_API_KEY=${DHL_API_KEY}
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_API_KEY=${ODOO_API_KEY}
      - WEBHOOK_URL=${WEBHOOK_URL}
    env_file:
      - .env
    # Hardening for a shared host: read-only filesystem, no Linux capabilities,
    # no privilege escalation. /tmp only holds the heartbeat file (heartbeat.py).
    read_only: true
    tmpfs:
      - /tmp:size=1m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured footprint: about 25 MiB of RAM, near-zero CPU, one process
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    networks:
      - dhl-tracker-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # The healthcheck is defined in the Dockerfile (python heartbeat.py)

networks:
  dhl-tracker-network:
    driver: bridge
