# Egress allow-list for the DHL tracker. The filter file is written at startup from
# EGRESS_ALLOWED_HOSTS by entrypoint.sh: one anchored "host:443" rule per line.
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20

# HTTPS tunnels (CONNECT) only to port 443
ConnectPort 443

# Deny everything the filter does not list. The filter matches the whole request target:
# "host:443" for an HTTPS tunnel, "http://host/..." for plain HTTP, which therefore never matches
Filter "/tmp/allowed-hosts"
FilterType ere
FilterURLs Yes
FilterDefaultDeny Yes

# Without LogFile or Syslog, tinyproxy logs to stdout (docker logs). Notice keeps refusals.
LogLevel Notice
DisableViaHeader Yes
